name: 功能建议
description: 提交业务功能或工程改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述员工、管理员或运维当前遇到的真实问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 用可验证的结果描述，例如接口状态码、SLA、权限边界。
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 建议优先级
      options:
        - P1 核心流程
        - P2 重要增强
        - P3 体验优化
        - P4 长期规划
    validations:
      required: true
